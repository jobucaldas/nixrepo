name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Nix Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting
        run: nix fmt -- --fail-on-change

      - name: Validate Nix Flake
        run: nix flake check

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build Packages
        run: |
          set -euo pipefail
          mapfile -t packages < <(
            nix eval --json .#packages.x86_64-linux \
              --apply 'packages: builtins.attrNames packages' |
              jq -r '.[] | select(. != "default")'
          )

          targets=()
          for package in "${packages[@]}"; do
            targets+=(".#${package}")
          done

          if [ ${#targets[@]} -eq 0 ]; then echo No packages found; exit 1; fi

          nix build --no-link "${targets[@]}"
